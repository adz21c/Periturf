name: CI

on:
  push:
    branches:
      - 'main'
      - 'feature/*'
    paths:
      - 'src/**'
      - '.github/workflows/ci.yml'
  pull_request:

env:
  REPORTS_PATH: ${{ github.workspace }}\artifacts\reports
  PACKAGE_PATH: ${{ github.workspace }}\artifacts\packages

jobs:
  build:
    name: Build
    
    outputs:
      gitversion_informationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}
      gitversion_fullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}
      gitversion_preReleaseLabel: ${{ steps.gitversion.outputs.preReleaseLabel }}

    runs-on: windows-latest
    steps:
      - name: Setup dotnet
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: 9.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.11
        with:
          versionSpec: '6.0.x'
          preferLatestVersion: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Git version requires complete history and sonarcloud for a better relevancy of analysis

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.1.11
        with:
          useConfigFile: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.
      
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner
      
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        working-directory: .\src
        run: |
          dotnet tool restore
          ..\.sonar\scanner\dotnet-sonarscanner begin /d:sonar.login="${{ secrets.SONAR_TOKEN }}" `
            /k:"adz21c_Periturf" `
            /o:"adz21c-github" `
            /v:"${{ steps.gitversion.outputs.fullSemVer }}" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.scanner.skipJreProvisioning=true `
            /d:sonar.scanner.scanAll=false `
            /d:sonar.cs.vscoveragexml.reportsPaths="${{ env.REPORTS_PATH }}\coverage.xml"
          
          dotnet build -c Release -p:Version="${{ steps.gitversion.outputs.fullSemVer }}" -p:InformationalVersion="${{ steps.gitversion.outputs.informationalVersion }}" 
          dotnet dotnet-coverage collect "dotnet test .\Periturf.Tests --no-restore --no-build -c Release" --settings:.\CodeCoverage.runsettings --output "${{ env.REPORTS_PATH }}\coverage.xml" --output-format Xml
          
          ..\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Package
        working-directory: .\src
        run: dotnet pack . --no-restore --no-build --include-symbols -p:SymbolPackageFormat=snupkg  -c Release -p:Version="${{ steps.gitversion.outputs.fullSemVer }}" -o "${{ env.PACKAGE_PATH }}"

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ env.PACKAGE_PATH }}\**
          retention-days: 5

